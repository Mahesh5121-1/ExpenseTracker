<html>
    <head>
        <title>View Salary</title>
        <link rel="stylesheet" type="text/css" href="CSS/stylesheet.css">
        <link href="addExpense.html">
        <link href="viewExpenses.html">
    </head>
    <body>
        <div class="salaryViewClass">
            <h2>Your Savings</h2>
            <p id="salaryDisplay">Loading...</p>
        </div>
    </body>
    <script src="JS/jquery-3.7.1.js"></script>
    <script>
    $(document).ready(function(){
       // $("#salaryDisplay").text("₹" + (localStorage.getItem("salary") || "Not Set"));
       let salary1=localStorage.getItem("salary");
       let salary2=localStorage.getItem("total");
       let salary3=salary1-salary2;
       $("#salaryDisplay").text("₹"+salary3);
    });
    </script>
</html>
