<html>
<head>
    <title>Add Expenses</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <div class="expense-form">
        <p><i>Add your Expenses here.</i></p>
        <input type="text" id="expenseInput1" placeholder="Expense Name">
        <input type="number" id="expenseInput2" placeholder="Amount 💲">
        <button type="button" id="addBtn">➕ Add</button>
    </div>

    <script src="jquery-3.7.1.js"></script>
    <script>
    $(document).ready(function(){
        $("#addBtn").click(function(){
            let name = $("#expenseInput1").val().trim();
            let amount = $("#expenseInput2").val().trim();
            if(name === "" || amount === "" || amount < 0){
                alert("Please enter valid expense name and amount");
                return;
            }

            let expenses = JSON.parse(localStorage.getItem("expenses")) || [];
            expenses.push({name: name, amount: Number(amount)});
            localStorage.setItem("expenses", JSON.stringify(expenses));

            $("#expenseInput1").val("");
            $("#expenseInput2").val("");
            alert("Expense added successfully!");
        });
    });
    </script>
</body>
</html>
