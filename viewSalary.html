<html>
<head>
    <title>View Savings</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <div class="salaryViewClass">
        <h2>Your Savings</h2>
        <p id="salaryDisplay">Loading...</p>
    </div>
</body>

<script src="jquery-3.7.1.js"></script>
<script>
$(document).ready(function(){
    let salary = Number(localStorage.getItem("salary")) || 0;
    let totalExpenses = Number(localStorage.getItem("total")) || 0;

    let remaining = salary - totalExpenses;
    if(remaining < 0) remaining = 0;

    $("#salaryDisplay").text("💰 ₹" + remaining.toFixed(2));
});
</script>
</html>
